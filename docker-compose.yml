version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verzel
      POSTGRES_USER: verzel
      POSTGRES_PASSWORD: verzel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verzel -d verzel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local}
      DEBUG: "True"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: verzel
      DB_USER: verzel
      DB_PASSWORD: verzel
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,teste-raizen-backend.vercel.app
      CORS_ALLOWED_ORIGINS: https://teste-raizen-frontend.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
    depends_on:
      - db
      - redis

  celery-worker:
    build: .
    command: celery -A verzel worker -l info
    volumes:
      - .:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local}
      DEBUG: "True"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: verzel
      DB_USER: verzel
      DB_PASSWORD: verzel
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A verzel beat -l info --scheduler celery.beat.PersistentScheduler
    volumes:
      - .:/app
      - celerybeat_data:/app/celerybeat
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local}
      DEBUG: "True"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: verzel
      DB_USER: verzel
      DB_PASSWORD: verzel
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
    depends_on:
      - db
      - redis

  test:
    build: .
    command: python -m pytest
    volumes:
      - .:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-test}
      DEBUG: "True"
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: /app/test_db.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
    profiles:
      - test

volumes:
  postgres_data:
  celerybeat_data:
