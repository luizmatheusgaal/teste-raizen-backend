version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verzel
      POSTGRES_USER: verzel
      POSTGRES_PASSWORD: verzel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verzel -d verzel"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local}
      DEBUG: "True"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: verzel
      DB_USER: verzel
      DB_PASSWORD: verzel
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - db

  test:
    build: .
    command: python -m pytest
    volumes:
      - .:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-test}
      DEBUG: "True"
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: /app/test_db.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
    profiles:
      - test

volumes:
  postgres_data:
